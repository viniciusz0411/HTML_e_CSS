<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texto mágico</title>
    <style>
        body{
            text-align: center;
        }
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: aliceblue;
            background-color: rgb(11, 90, 15);
        }
        div:hover{

            color: brown;
        }
    </style>
</head>
<body>
    <h2>Exemplo de hover:</h2>
    <div>
        Passe o mouse AQUI!
        <p>TEXTO ESCONDIDO</p>
    </div>
</body>
</html>
