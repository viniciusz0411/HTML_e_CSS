<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela complexa</title>
    <style>
        table{
            width: 400px;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
            padding: 10px;
        }
        th{
            background-color: aquamarine;
        }
        tbody > tr:nth-child(even){
            /*Pinta as linhas ímpares.*/
            background-color: rgb(67, 68, 70);
        }
    </style>
</head>
<body>
    <caption>Números</caption>
    <table>
        <thead>
            <tr>
                <th>num</th>
                <th>num</th>
                <th style="width: 200px;">num</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>1</td>
                <td>1</td>
            </tr>
            <tr>
                <td>3</td>
                <td>3</td>
                <td>3</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>2</td>
                <td>2</td>
                <td>2</td>
            </tr>
        </tfoot>
</table>
</body>
</html>
