<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 50vh;
            background-color: antiquewhite;
            display: grid;
            grid-template: repeat(8, 1fr) / repeat(6, 1fr);
            gap: 10px;
            place-items: auto;
            grid-auto-flow: column;
            grid-auto-rows: 1fr;
            grid-auto-columns: 1fr;
        }
        .item1{
            background-color: aquamarine;
            grid-row-start: 1;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: -1;
        }
        .item2{
            background-color: blue;
            grid-row-start: 3;
            grid-row-end: 8;
            grid-column-start: 1;
            grid-column-end: 6;
        }
        .item3{ 
            grid-row-start: 3;
            grid-row-end:8;
            grid-column-start: 6;
            grid-column-end: -1;
            background-color: blueviolet;
        }
        .item4{
            background-color: coral;
            grid-row-start: 8;
            grid-row-end: span 1;
            grid-column-start: 1;
            grid-column-end: span 6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">Titulo</div>
        <div class="item2">Corpo</div>
        <div class="item3">Ads</div>
        <div class="item4">Rodapé</div>
    </div>
</body>
</html>
