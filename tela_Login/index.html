<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <main>
        <div id="img">
        </div>
        <div id="txt">
            <h2>Tela de Login</h2>
            <p>Para ajustar as configurações do seu dispositivo, acesse sua conta!</p>
            <form action="enviar.js" method="post" autocomplete="on">
                <div class="inf">
                    <label for="email"><span class="material-symbols-outlined">mail</span></label>
                    <input type="email" name="email" id="email" required maxlength="30" placeholder=" @" autocomplete="email" style="border: none; border-radius: 5px;">
                </div>
                <div class="inf">
                    <label for="senha"><span class="material-symbols-outlined">lock</span></label>
                    <input type="password" name="senha" id="senha" placeholder="  ********" required minlength="8" maxlength="15" autocomplete="current-password" style="border: none; border-radius: 5px; max-width: 40%;">
                </div>
                <div>
                    <input type="submit" value="Enviar">
                    <input type="button" value="Esqueci a senha">
                </div>
            </form>
        </div>
    </main>
</body>
</html>
