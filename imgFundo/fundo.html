<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundo Personalizado</title>
    <style>
        body{
            background-image: url('imgs/wallpaper001.jpg');
        }
        div.quadrado{
            display: inline-block;
            background-color: rgb(233, 233, 142);
            border: 1px solid black;
            width: 300px;
            height: 300px;
        }
        #q1{
            background-color: aquamarine;
        }
        #q2{
            background-image: linear-gradient(to top, red, yellow);
        }
        #q3{
            background-image: url('imgs/pattern003.png');
        }
    </style>
</head>
<body>
    <div class="quadrado" id="q1"></div>
    <div class="quadrado" id="q2"></div>
    <div class="quadrado" id="q3"></div>
</body>
</html>
