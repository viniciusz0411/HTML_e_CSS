<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        h2{
            text-align: center;
        }
        .Wrap{
            display: flex;
            flex-flow: row wrap;
            background-color: bisque;
        }
        .Nowrap{
            display: flex;
            flex-flow: row nowrap;
        }
        .items{
            background-color: aqua;
            border: 1px solid black;
            padding: 10px 30px;
            flex: auto;
        }
    </style>
</head>
<body>
    <h2>Row Wrap</h2>
    <div class="Wrap">
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
    </div>
    <h2>Row nowrap</h2>
        <div class="Nowrap">
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
        <div class="items">blablablabla</div>
    </div>
</body>
</html>
