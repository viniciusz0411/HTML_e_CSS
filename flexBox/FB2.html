<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        main{
            background-color: aquamarine;
            width: 100vw;
            height: 500px;
            display: flex;
            flex-flow: row wrap;
            align-items: flex-start;
        }
        div{
            padding: 40px;
            background-color: blanchedalmond;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <main>
        <div style="align-self: center;">1</div>
        <div>2</div>
        <div style="align-self: stretch;">3</div>
        <div>4</div>
        <div style="align-self: flex-end;">5</div>
    </main>
</body>
</html>
