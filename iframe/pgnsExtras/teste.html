<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
    <style>
        table{
            margin: auto;
        }
        td{
            border: 1px solid;
            padding: 30px;
            width: 50px;
            text-align: center;
            vertical-align: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
        </tr>        
        <tr>
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>        
        <tr>
            <td>J</td>
            <td>Q</td>
            <td>L</td>
        </tr>        
        <tr>
            <td colspan="4">M</td>
        </tr>
    </table>
</body>
</html>
