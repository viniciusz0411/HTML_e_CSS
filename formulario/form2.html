<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check box e radio</title>
</head>
<body>
    <fieldset>
        <legend>sexo</legend>
        <input type="radio" name="sexo" id="mas" checked><label for="mas">Masculino</label><br>
        <input type="radio" name="sexo" id="fem"><label for="fem">Feminino</label>
    </fieldset>
    <fieldset>
        <legend>numeros</legend>
        <input type="checkbox" name="1" id="1"><label for="1">1</label>
        <input type="checkbox" name="2" id="2"><label for="2">2</label>
    </fieldset>
</body>
</html>
