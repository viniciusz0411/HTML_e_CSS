<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label</title>
</head>
<body>
    <h1>Label</h1>
    <form action="#" autocomplete="on" method="post">
        <label for="itexto">Nome:</label>
            <input type="text" name="texto" id="itexto" required minlength="5" maxlength="30" placeholder="Nome" size="10" autocomplete="username">
        <label for="itexto">Senha:</label>
            <input type="password" name="text" id="itexto" required minlength="8" maxlength="16" placeholder="Senha" size="8" autocomplete="new-password"><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Apagar">
    </form>
</body>
</html>
