<!DOCTYPE html>

</head>
<body>
    <h1>Tipos de listas.</h1>
    <hr>

        <li>Acordar</li>
        <li>Ir para a escola</li>

        <li>Comer</li>
        <li>Dormir</li>
    </Ul>
</body>
